name: collect-facilities

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 UTC 00:00 = 한국시간 오전 9시
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run collector
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: python collectors/facility_collector.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/*.csv
          git diff --cached --quiet || git commit -m "data: daily facility collection $(date -u -d '+9 hours' +%F)"
          git push
